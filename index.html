<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6663">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 0}body{margin:0}[hidden]{display:none!important}</style>
<title>Canten Alabanzas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: lista de cantos a la izquierda y partitura a la derecha en iPad; una sola columna con barra inferior en celular. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E7ECEF; --ink:#17212B; --muted:#58656F; --line:#D3DADF;
  --accent:#0D6663; --accent-ink:#FFFFFF; --accent-soft:#D9EEEC; --chord:#B0341B;
  --good:#1D7444; --warn:#94600A; --danger:#B3261E;
  --font-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#192029; --surface-2:#232C37; --ink:#E7ECF1; --muted:#96A3AF; --line:#2D3844;
    --accent:#4FC6BD; --accent-ink:#06201F; --accent-soft:#17383A; --chord:#FF9D75;
    --good:#5CC98A; --warn:#E5B04F; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#192029; --surface-2:#232C37; --ink:#E7ECF1; --muted:#96A3AF; --line:#2D3844;
  --accent:#4FC6BD; --accent-ink:#06201F; --accent-soft:#17383A; --chord:#FF9D75;
  --good:#5CC98A; --warn:#E5B04F; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
small{font-size:.8125rem}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem;font-weight:700}
.top .warn{font-size:.8125rem;color:var(--warn);font-weight:500}
main{flex:1;min-height:0}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;min-height:56px;border:0;background:none;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:3px solid transparent}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.tab span{font-size:.8125rem}

/* dos paneles */
.split{height:100%;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);min-height:0}
.pane{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.list-pane{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.detail-pane{padding:16px;padding-bottom:40px}
@media (max-width:879px){
  .split{grid-template-columns:minmax(0,1fr)}
  .list-pane{border-right:0}
  .split.has-sel .list-pane{display:none}
  .split:not(.has-sel) .detail-pane{display:none}
}
@media (min-width:880px){ .back{display:none!important} .detail-pane{padding:20px 28px 48px} }

.toolbar{padding:12px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.toolbar .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.input,.select,.textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.textarea{min-height:110px;resize:vertical}
.textarea.mono{font-family:var(--font-mono);font-size:.9375rem;line-height:1.4;white-space:pre;overflow:auto}
label.f{display:grid;gap:4px;font-weight:600;font-size:.875rem;color:var(--muted);min-width:0}
label.f .input,label.f .select,label.f .textarea{color:var(--ink);font-weight:400}

.list{flex:1;min-height:0;overflow:auto}
.row-song{display:grid;gap:2px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;min-height:64px}
.row-song[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.row-song .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row-song .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row-song .k{font-family:var(--font-mono);font-weight:600;color:var(--accent);white-space:nowrap;font-size:.9375rem}
.row-song .m{color:var(--muted);font-size:.875rem}
.row-song .lp{font-size:.8125rem;color:var(--muted)}
.row-song .lp.stale{color:var(--warn);font-weight:500}
.empty{padding:28px 16px;color:var(--muted);text-align:center;text-wrap:balance}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.sure{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem}
.btn.link{border:0;background:none;padding:0;min-height:0;color:var(--accent);text-align:left}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.head{display:grid;gap:6px;margin-bottom:14px}
.head h2{font-size:1.75rem;font-weight:700;line-height:1.15}
.sub{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tag.ex{background:var(--accent-soft);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:grid;gap:12px}
.card h3{font-size:1rem;font-weight:700}
.lab{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:46px;min-height:46px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--font-mono);font-weight:600;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;position:relative}
.chip small{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:.6875rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:var(--accent-ink);opacity:.85}
.chip.sing::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.chip.on.sing::after{background:var(--accent-ink)}
.chip.easy:not(.on){border-color:var(--accent)}
.hint{font-size:.875rem;color:var(--muted)}
.hint b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;overflow-x:auto;font-family:var(--font-mono);font-weight:500;line-height:1.35;-webkit-overflow-scrolling:touch}
.chart .cl{white-space:pre;color:var(--chord);font-weight:600}
.chart .ly{white-space:pre}
.chart .gap{height:.8em}
.chart .sec{font-family:var(--font-body);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:1.1em 0 .35em}
.chart .sec:first-child{margin-top:0}
.chart-empty{color:var(--muted);font-family:var(--font-body);white-space:normal}
.cols{column-gap:36px;column-rule:1px solid var(--line)}
.cols .blk{break-inside:avoid}
.cols .sec{break-after:avoid;break-inside:avoid}
.cols>.sec:first-child{margin-top:0}
.cols>.gap:first-child{display:none}
.tag.cat{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.wide{font-family:var(--font-body);padding:2px 16px}
.notice{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.readbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg);padding:2px 0 10px}
.readbar .rt{display:grid;min-width:0;flex:1 1 220px}
.readbar .rt b{font-family:var(--font-display);font-size:1.125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readbar .rt span{font-size:.875rem;color:var(--muted)}
.readbar .rc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#app.reading .top,#app.reading .tabs{display:none}
#app.reading .split{grid-template-columns:minmax(0,1fr)}
#app.reading .list-pane{display:none}
#app.reading .detail-pane{padding:10px 16px 16px}
#app.reading .chart{margin-bottom:0}

.pick-results{max-height:min(46vh,380px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-top:1px solid var(--line);margin-top:8px}
.list-plain{display:grid;gap:0;margin:0;padding:0;list-style:none}
.list-plain li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-height:44px}
.list-plain li:first-child{border-top:0}
.list-plain .why{font-size:.8125rem;color:var(--muted)}
.list-plain .grow{min-width:0;display:grid}
.grow{min-width:0}
.pairrow{display:flex;gap:8px}
.pairrow .select{flex:1}

.form{display:grid;gap:14px;max-width:760px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .no{font-family:var(--font-mono);font-weight:600;color:var(--muted);width:1.6em;text-align:center}
.item .ttl{font-weight:600;overflow-wrap:anywhere}
.item .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item .ksel{min-height:40px;width:auto;padding:4px 8px;font-family:var(--font-mono);font-weight:600}
.iconbtn{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.trans{font-size:.8125rem;padding:4px 0 4px 40px;color:var(--muted)}
.trans.ok{color:var(--good)}
.trans.jump{color:var(--warn)}
.items{display:grid;gap:0;margin-bottom:14px}
.set-row{display:grid;gap:2px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;min-height:60px}
.set-row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.page{padding:16px;max-width:820px;margin:0 auto;height:100%;overflow:auto;padding-bottom:40px}
.stat{display:flex;gap:20px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font-family:var(--font-display);font-size:1.5rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

.tag.th{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.theme{font-family:var(--font-body);padding:2px 14px;min-height:40px}
.sub-actions{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.only{color:var(--accent);font-weight:600}
.partsbox{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.partsbox .quick{display:flex;gap:8px;flex-wrap:wrap}
.partrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;text-align:left;min-height:48px}
.partrow .bx{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink);margin-top:1px}
.partrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.partrow[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.partrow b{display:block}
.partrow small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.startbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.startbar .btn.primary{min-height:52px;font-size:1.0625rem;padding:0 22px}
body.pl-open{overflow:hidden}
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;color:var(--ink)}
.pl-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pl-bar .pl-t{flex:1;min-width:0;display:grid;line-height:1.2}
.pl-bar .pl-t b{font-family:var(--font-display);font-size:1rem}
.pl-bar .pl-t span{font-size:.8125rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-set{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:grid;gap:12px;max-height:60vh;overflow:auto}
.pl-set[hidden]{display:none}
.pl-set .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pl-set .row .lab{min-width:92px}
.pl-track{flex:1;min-height:0;display:flex;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.player[data-dir="l"] .pl-track,.player[data-dir="r"] .pl-track{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:auto;overscroll-behavior:contain}
.player[data-dir="r"] .pl-track{direction:rtl}
.player[data-dir="v"] .pl-track{flex-direction:column;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity}
.pl-page{direction:ltr;scroll-snap-align:start;scroll-snap-stop:always;padding:12px 16px 20px;min-width:0}
.player[data-dir="l"] .pl-page,.player[data-dir="r"] .pl-page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto}
.player[data-dir="v"] .pl-page{border-top:6px solid var(--surface-2);padding-bottom:36px}
.player[data-dir="v"] .pl-page:first-child{border-top:0}
.pl-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.pl-h b{font-family:var(--font-display);font-size:1.375rem;line-height:1.15}
.pl-h .pl-n{font-family:var(--font-mono);font-size:.8125rem;color:var(--muted);font-weight:600}
.pl-h .pl-m{font-size:.9375rem;color:var(--muted)}
.player .chart{border:0;background:transparent;padding:4px 2px;margin:0;overflow-x:auto;overflow-y:visible}
.pl-next{margin-top:18px;color:var(--muted);font-size:.9375rem;border-top:1px dashed var(--line);padding-top:10px}
.player:not([data-dir="v"]) .pl-next{display:none}
.pl-nav{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.92;z-index:3}
.pl-nav:disabled{opacity:.3}
.player[data-dir="v"] .pl-nav{display:none}
</style>

  </nav>
</div>

<script>
(function(){
'use strict';
/* ---------- música ---------- */
var SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var LBL=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var ROOT={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
var FLATMAJ=[5,10,3,8,1,6];
var CATS=[['calmada','Calmada'],['movida','Movida'],['himno','Himno'],['corito','Corito'],['chanting','Chanting']];
var THEMES=['El amor de Dios','El sacrificio de Jesús','Gracia','Salvación y perdón','Resurrección','El regreso de Cristo','Adoración','Alabanza y gozo','Grandeza y poder de Dios','Fidelidad y bondad','El Espíritu Santo','Paz y descanso','Esperanza y fe','Entrega y consagración','Unidad e iglesia','La Palabra de Dios','Luz','Navidad','Santa Cena','El cielo y la eternidad','Buscar a Dios','Gratitud','Evangelismo y siembra','El nombre de Jesús'];
function catLabel(id){ for(var i=0;i<CATS.length;i++) if(CATS[i][0]===id) return CATS[i][1]; return id; }
function mod(n){return ((n%12)+12)%12;}
function useFlats(root,minor){return FLATMAJ.indexOf(minor?mod(root+3):mod(root))>-1;}
function keyName(r,minor){return LBL[mod(r)]+(minor?'m':'');}
function shapeName(r,minor){return (useFlats(r,minor)?FL:SH)[mod(r)]+(minor?'m':'');}
function isEasy(r,minor){return (minor?[9,4,2]:[7,0,2,9,4]).indexOf(mod(r))>-1;}

var SUF='(?:maj|min|dim|aug|sus|add|m|M|\\+|°|º|-)?(?:\\d+|sus\\d?|add\\d+|[b#]\\d+|\\([^)]*\\))*';
var CHRE=new RegExp('^([A-G][#b]?)('+SUF+')(?:\\/([A-G][#b]?))?$');
var PASS=/^(\||\/|-|%|\.{2,}|\(?x\d+\)?|N\.C\.?)$/i;
function tChord(tok,semis,flats){
  if(!semis) return tok;
  var m=CHRE.exec(tok); if(!m) return tok;
  var set=flats?FL:SH;
  var out=set[mod(ROOT[m[1]]+semis)]+m[2];
  if(m[3]) out+='/'+set[mod(ROOT[m[3]]+semis)];
  return out;
}
function isChordLine(l){
  var t=l.trim().split(/\s+/); if(!t[0]) return false;
  var chords=0;
  for(var i=0;i<t.length;i++){ if(CHRE.test(t[i])) chords++; else if(!PASS.test(t[i])) return false; }
  return chords>0;
}
var SECRE=/^(verso|coro|puente|intro|pre-?coro|final|interludio|estribillo|instrumental|chorus|pre-?chorus|verse|bridge|outro|interlude|refrain|refr[aá]n|tag)\s*\d*\s*[:.]?$/i;
function isSection(l){
  var t=l.trim(); if(!t) return false;
  var m=t.match(/^\[([^\]]+)\]$/);

    if(ui.fr && s.rhythm!==ui.fr) return false;
    if(ui.fc && s.cats.indexOf(ui.fc)<0) return false;

  var cmpT=function(x,y){return x.title.localeCompare(y.title,'es');};
  if(ui.sort==='title') a.sort(cmpT);
  if(ui.sort==='stale') a.sort(function(x,y){var dx=sinceLast(x),dy=sinceLast(y); if(dx===null&&dy===null) return cmpT(x,y); if(dx===null) return -1; if(dy===null) return 1; return dy-dx;});

function transition(a,b){
  var sa=song(a.sid), sb=song(b.sid), d=mod(b.k-a.k), sg=d>6?d-12:d, ab=Math.abs(sg), parts=[], cls='ok';
  if(sg===0) parts.push('misma tonalidad');
  else { parts.push((sg>0?'sube ':'baja ')+(ab===1?'medio tono':ab===2?'1 tono':ab===3?'1½ tonos':ab+' semitonos')); if(ab>2) cls='jump'; }
  if(sa&&sb&&sa.tempo&&sb.tempo){ var td=Math.abs(sa.tempo-sb.tempo); if(td>25){ parts.push('cambio fuerte de tempo ('+sa.tempo+' → '+sb.tempo+')'); cls='jump'; } else if(td<=12) parts.push('tempo parecido'); }
  if(a.sid===b.sid) return '<div class="trans ok">↓ vuelve al mismo canto</div>';
  return '<div class="trans '+cls+'">↓ '+parts.join(' · ')+'</div>';
}

/* ---------- partes de un canto ---------- */
function blocksOf(s){
  var lines=String(s.chart||'').replace(/\r/g,'').split('\n'), out=[], cur=[];
  function lyr(l){ return l!==undefined&&l.trim()&&!isSection(l)&&!isChordLine(l)&&!/\[[A-G][^\]]*\]/.test(l); }
  function flush(){ while(cur.length&&!cur[cur.length-1].trim()) cur.pop(); if(cur.some(function(l){return l.trim();})) out.push(cur); cur=[]; }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(!l.trim()){
      if(!cur.length) continue;
      if(cur.length===1&&isSection(cur[0])) continue;
      var j=i+1; while(j<lines.length&&!lines[j].trim()) j++;
      if(isChordLine(cur[cur.length-1])&&lyr(lines[j])) continue;
      flush(); continue;
    }
    if(isSection(l)&&cur.length&&!(cur.length===1&&isSection(cur[0]))) flush();
    cur.push(l);
  }
  flush();
  var n=0, seen={};
  return out.map(function(b){
    var sec=isSection(b[0]), lab;
    if(sec){ lab=cleanSection(b[0]); if(lab===lab.toUpperCase()) lab=lab.charAt(0)+lab.slice(1).toLowerCase(); } else { n++; lab='Estrofa '+n; }
    var key=lab.toLowerCase(); seen[key]=(seen[key]||0)+1; if(seen[key]>1) lab+=' ('+seen[key]+')';
    var snip=''; for(var q=0;q<b.length;q++){ if(isSection(b[q])||isChordLine(b[q])) continue; snip=b[q].replace(/\[[^\]]*\]/g,'').trim(); if(snip) break; }
    return {lines:b,label:lab,snip:snip.length>46?snip.slice(0,44)+'…':snip,coro:/coro|estribillo|chorus|refr/i.test(lab)&&!/pre/i.test(lab)};
  });
}
function partsChart(s,parts){
  if(!parts||!parts.length) return String(s.chart||'');
  var bl=blocksOf(s), sel=parts.filter(function(i){return i>=0&&i<bl.length;}).sort(function(a,b){return a-b;});
  if(!sel.length) return String(s.chart||'');
  return sel.map(function(i){return bl[i].lines.join('\n');}).join('\n\n');
}
function partsLabel(s,parts){
  if(!parts||!parts.length) return '';
  var bl=blocksOf(s); return parts.filter(function(i){return i<bl.length;}).sort(function(a,b){return a-b;}).map(function(i){return bl[i].label;}).join(', ');
}
function partsBox(it,i){
  var s=song(it.sid), bl=blocksOf(s);
  if(bl.length<2) return '<div class="partsbox"><div class="hint">Este canto no tiene partes separadas todavía. Sepáralas con una línea en blanco o con títulos como [Coro] en el editor.</div></div>';
  var sel=it.parts&&it.parts.length?it.parts:bl.map(function(b,n){return n;});
  var hasCoro=bl.some(function(b){return b.coro;});
  return '<div class="partsbox"><div class="lab">¿Qué partes de “'+esc(s.title)+'” van en este lugar?</div>'+
   '<div class="quick"><button class="btn sm" data-a="ptall" data-i="'+i+'">Todo el canto</button>'+(hasCoro?'<button class="btn sm" data-a="ptcoro" data-i="'+i+'">Solo el coro</button>':'')+'<button class="btn sm" data-a="ptdone" data-i="'+i+'">Listo</button></div>'+
   bl.map(function(b,n){var on=sel.indexOf(n)>-1; return '<button type="button" class="partrow" data-a="pt" data-i="'+i+'" data-b="'+n+'" aria-pressed="'+on+'"><span class="bx">'+(on?'✓':'')+'</span><span style="min-width:0"><b>'+esc(b.label)+'</b><small>'+esc(b.snip)+'</small></span></button>';}).join('')+'</div>';
}
function renderItems(){

     (ui.partsIdx===i?partsBox(it,i):'')+'</div>';
  }).join('');

function bestKeyNear(s,prevK){ var ks=singKeys(s), best=ks[0], bd=99; ks.forEach(function(k){var d=circ(k,prevK); if(d<bd){bd=d;best=k;}}); return {k:best,d:bd}; }
function pfOk(s){ if(ui.pcat&&s.cats.indexOf(ui.pcat)<0) return false; if(ui.pkey!==''&&singKeys(s).indexOf(+ui.pkey)<0&&s.orig!==+ui.pkey) return false; return true; }
function suggestions(x){
  var used=x.items.map(function(i){return i.sid;}), pool=db.songs.filter(function(s){return used.indexOf(s.id)<0&&s.cats.indexOf('chanting')<0&&pfOk(s);});
  var prev=x.items.length?x.items[x.items.length-1]:null, ps=prev&&song(prev.sid);
  var r=pool.map(function(s){
    var sc=0, why=[], k=singKeys(s)[0], d=sinceLast(s);
    if(prev&&ps){
      var b=ui.pkey!==''?{k:+ui.pkey,d:Math.min(mod(+ui.pkey-prev.k),mod(prev.k-+ui.pkey))}:bestKeyNear(s,prev.k); k=b.k; sc+=3-b.d*0.8;
      why.push(b.d===0?'misma tonalidad':(mod(b.k-prev.k)>6?'baja ':'sube ')+(b.d===1?'medio tono':b.d+' semitonos'));
      if(ps.tempo&&s.tempo){ var td=Math.abs(ps.tempo-s.tempo); sc+=Math.max(-1.5,1.5-td/20); if(td<=12) why.push('tempo parecido'); }
      if(ps.links.indexOf(s.id)>-1){ sc+=2; why.push('vinculado'); }
    }
    if(d===null){ sc+=0.8; why.push('nunca registrado'); } else if(d<14){ sc-=1.5; why.push('tocado '+ago(d)); } else { sc+=Math.min(0.8,d/60); if(d>=28) why.push('sin tocar '+ago(d).replace('hace ','hace ')); }
    return {s:s,k:k,sc:sc,why:why};
  }).sort(function(a,b){return b.sc-a.sc;});
  return r.slice(0,40);
}
function chantSuggest(x){
  if(!x.items.length) return [];
  var last=x.items[x.items.length-1], ls=song(last.sid), used=x.items.map(function(i){return i.sid;});
  return db.songs.filter(function(s){return used.indexOf(s.id)<0&&s.cats.indexOf('chanting')>-1&&(ui.pkey===''||singKeys(s).indexOf(+ui.pkey)>-1||s.orig===+ui.pkey);}).map(function(s){
    var b=ui.pkey!==''?{k:+ui.pkey,d:Math.min(mod(+ui.pkey-last.k),mod(last.k-+ui.pkey))}:bestKeyNear(s,last.k), d=sinceLast(s), sc=-b.d*2+(d===null?0.5:Math.min(1,d/60)-(d<14?1:0));
    if(ls&&ls.tempo&&s.tempo) sc-=Math.abs(ls.tempo-s.tempo)/60;
    return {s:s,k:b.k,d:b.d,sc:sc,days:d};
  }).sort(function(a,b){return b.sc-a.sc;}).slice(0,6);
}
function renderPick(){
  var x=curSet(), el=$('#pick-results'); if(!x||!el) return;
  var q=ui.pq.trim().toLowerCase(), used=x.items.map(function(i){return i.sid;}), html='';
  function row(s,k,why){ return '<li><div class="grow"><b>'+esc(s.title)+'</b><span class="why">en '+keyName(k,s.minor)+(why.length?' · '+why.join(' · '):'')+'</span></div><button class="btn sm" data-a="additem" data-id="'+s.id+'" data-k="'+k+'">Agregar</button></li>'; }
  if(!q){

    if(ch.length&&!ui.pcat){

      html+='<div class="lab" style="margin-top:6px">'+(same?'Para cerrar con chanting en el mismo tono ('+keyName(last.k,false)+')':'Chanting en tonos cercanos al último')+'</div><ul class="list-plain">'+
        ch.map(function(c){ var why=[c.d===0?'mismo tono':'a '+c.d+(c.d===1?' semitono':' semitonos')]; if(c.s.tempo) why.push(c.s.tempo+' bpm'); if(c.days!==null&&c.days<14) why.push('tocado '+ago(c.days)); return row(c.s,c.k,why); }).join('')+'</ul>';
    }
    if(!html) html='<div class="hint">Todos los cantos ya están en este repertorio.</div>';
  } else {
    var m=db.songs.filter(function(s){return used.indexOf(s.id)<0 && (s.title+' '+s.artist+' '+s.tags.join(' ')+' '+s.themes.join(' ')+' '+s.rhythm+' '+s.cats.map(catLabel).join(' ')).toLowerCase().indexOf(q)>-1;})  .filter(pfOk).slice(0,40);
    html=m.length?'<ul class="list-plain">'+m.map(function(s){return row(s,ui.pkey!==''?+ui.pkey:singKeys(s)[0],[]);}).join('')+'</ul>':'<div class="hint">Ningún canto de tu libro coincide.</div>';
    if(C.user){

      else {
        var nq=normT(q), cm=C.songs.filter(function(c){ return normT(c.title+' '+c.artist).indexOf(nq)>-1 && !localOf(c.id,c.title); }).slice(0,15);
        if(cm.length) html+='<div class="lab" style="margin-top:8px">Del catálogo de la comunidad</div><ul class="list-plain">'+cm.map(function(c){ return '<li><div class="grow"><b>'+esc(c.title)+'</b><span class="why">'+(c.artist?esc(c.artist)+' · ':'')+'se agrega también a tu libro</span></div><button class="btn sm" data-a="cl-pickadd" data-id="'+c.id+'">Agregar</button></li>'; }).join('')+'</ul>';
      }
    }
  }
  el.innerHTML=html;
  var pc=$('#pick-cats');
  if(pc) pc.innerHTML=[['','Todas'],['calmada','Calmadas'],['movida','Movidas']].map(function(c){return '<button class="chip wide'+(ui.pcat===c[0]?' on':'')+'" data-a="pcat" data-c="'+c[0]+'" aria-pressed="'+(ui.pcat===c[0])+'">'+c[1]+'</button>';}).join('')+
    '<select class="select" id="pick-key" aria-label="Tono" style="width:auto;min-height:40px"><option value="">Tono: cualquiera</option>'+LBL.map(function(n,i){return '<option value="'+i+'"'+(String(ui.pkey)===String(i)?' selected':'')+'>Tono '+n+'</option>';}).join('')+'</select>';
}


/* ---------- EMPEZAR: todos los cantos del repertorio, deslizando ---------- */
var PL={on:false,dir:'l',cols:0,fs:22,i:0,items:[]};

}
function plPage(it,idx){
  var s=song(it.sid), capo=(s.capoByKey||{})[it.k]||0, shape=mod(it.k-capo), N=PL.items.length;
  var meta='Suena en '+keyName(it.k,s.minor)+(capo?' · capo '+capo+' · formas de '+shapeName(shape,s.minor):' · sin capo');
  var only=partsLabel(s,it.parts), body;

    function set(f,n){ c.style.fontSize=f+'px'; cols.style.columnGap=gap+'px'; cols.style.columnCount=n; }
    var f=PL.fs, n;
    if(PL.cols>0){
      n=PL.cols; f=Math.max(vert?13:11,Math.min(f,Math.floor((avail-gap*(n-1))/n/(len*W))));

      return;

  var d=v.data||{}; var n=norm({songs:[{id:uid(),title:cs.title,artist:cs.artist,orig:d.orig,minor:d.minor,keys:d.keys,tempo:d.tempo,rhythm:d.rhythm,cats:d.cats,themes:d.themes,tags:d.tags,notes:d.notes,chart:d.chart,capoByKey:d.capoByKey,history:[],links:[]}]}).songs[0];
  n.cloud={sid:cs.id,vid:v.id,h:'',own:v.author===(C.user&&C.user.id)}; n.cloud.h=hash(payload(n)); return n;
}
function applyVersion(s,v){ var d=v.data||{}; var n=songFromCloud({id:s.cloud&&s.cloud.sid,title:s.title,artist:s.artist},v);
  ['orig','minor','keys','tempo','rhythm','cats','themes','tags','notes','chart','capoByKey'].forEach(function(k){ s[k]=n[k]; }); s.cloud={sid:s.cloud?s.cloud.sid:n.cloud.sid,vid:v.id,h:hash(payload(s)),own:v.author===C.user.id}; }
/* --- publicar --- */
async function cFind(s){
  var n=normT(s.title), hit=null;
  if(C.songs) hit=C.songs.filter(function(x){return normT(x.title)===n;})[0];
  else { var r=ck(await C.sb.from('songs').select('id,title,artist,created_by,main_version').ilike('title',s.title.replace(/[%_\\]/g,'\\$&')).limit(20)); hit=(r.data||[]).filter(function(x){return normT(x.title)===n;})[0]; }
  return hit||null;
}
async function cPublish(s){
  var p=payload(s), ex=await cFind(s), r;
  if(ex){
    r=ck(await C.sb.from('song_versions').insert({song_id:ex.id,name:'Versión de '+myName(),data:p}).select('id').single());
    s.cloud={sid:ex.id,vid:r.data.id,h:hash(p),own:true}; return 'version';
  }
  r=ck(await C.sb.rpc('publish_song',{p_title:s.title,p_artist:s.artist||'',p_data:p}));
  s.cloud={sid:r.data.song,vid:r.data.version,h:hash(p),own:true};
  if(C.songs) C.songs.push({id:r.data.song,title:s.title,artist:s.artist||'',created_by:C.user.id,main_version:r.data.version});
  return 'new';
}
async function cSaveVersion(s){
  var p=payload(s), c=s.cloud;
  if(c.own&&c.vid){ ck(await C.sb.from('song_versions').update({data:p}).eq('id',c.vid)); }
  else { var r=ck(await C.sb.from('song_versions').insert({song_id:c.sid,name:'Versión de '+myName(),data:p}).select('id').single()); c.vid=r.data.id; c.own=true; }
  c.h=hash(p); C.vers=[];
}
function cloudBtns(s){
  if(!C.user) return '';
  var c=s.cloud;
  if(s.example) return '';
  if(!c) return '<button class="btn" data-a="cl-pub" data-id="'+s.id+'">Compartir en el catálogo</button>';
  if(hash(payload(s))!==c.h) return '<button class="btn" data-a="cl-savever" data-id="'+s.id+'">'+(c.own?'Actualizar mi versión en la nube':'Guardar como mi versión')+'</button>';
  return '<span class="hint" style="align-self:center">☁ En el catálogo</span>';
}
function cAuto(s){
  if(!C.user||!C.auto||s.example) return;
  if(!s.cloud){ cPublish(s).then(function(){ save(); toast('Canto compartido en el catálogo'); }).catch(function(){}); }
  else if(s.cloud.own&&hash(payload(s))!==s.cloud.h){ cSaveVersion(s).then(function(){ save(); }).catch(function(){}); }
}
async function cBulk(){
  if(!C.songs) await cLoadSongs();
  var todo=db.songs.filter(function(s){return !s.cloud&&!s.example&&s.chart&&s.chart.trim();}), n=0, nv=0;
  for(var i=0;i<todo.length;i++){
    C.prog='Subiendo '+(i+1)+' de '+todo.length+'…'; cRender();
    try{ var r=await cPublish(todo[i]); if(r==='new') n++; else nv++; }catch(e){ if(/fetch|network/i.test(String(e.message))) throw e; }
    if(i%10===9) save();
  }
  save(); toast(n+' cantos nuevos y '+nv+' versiones en el catálogo');
}

async function cShareGo(){
  var x=db.sets.filter(function(y){return y.id===C.sharing.setId;})[0]; if(!x) return;

  var old=cShares()[x.id];
  if(!team&&!emails.length&&!old){ throw new Error('Elige un equipo o escribe al menos un correo.'); }
  if(!C.songs) await cLoadSongs();
  var np=0;
  for(var i=0;i<x.items.length;i++){ var s=song(x.items[i].sid); if(s&&!s.cloud){ C.prog='Agregando "'+s.title+'" al catálogo…'; cRender(); await cPublish(s); np++; } }
  save();
  var data={name:x.name,date:x.date,items:x.items.map(function(it){ var s=song(it.sid); if(!s||!s.cloud) return null; var o={sid:s.cloud.sid,vid:s.cloud.vid,t:s.title,a:s.artist,k:it.k}; if(it.parts) o.parts=it.parts; return o; }).filter(Boolean)};
  var id=old;
  if(id){ var u=ck(await C.sb.from('shared_sets').update({title:setTitle(x),data:data,team_id:team}).eq('id',id).select('id')); if(!(u.data||[]).length) id=null; }
  if(!id){ id=ck(await C.sb.from('shared_sets').insert({title:setTitle(x),data:data,team_id:team}).select('id').single()).data.id; }
  cShareSet(x.id,id);
  if(emails.length) ck(await C.sb.from('set_shares').upsert(emails.map(function(e){return {set_id:id,email:e};}),{onConflict:'set_id,email',ignoreDuplicates:true}));
  C.sharing=null; C.sets=null;
  toast('Repertorio compartido'+(np?' ('+np+' cantos nuevos en el catálogo)':''));
}
async function cCopySet(id){
  var r=(C.sets||[]).filter(function(y){return y.id===id;})[0]; if(!r) return;
  var its=(r.data&&r.data.items)||[], items=[], miss=0, need=[];
  its.forEach(function(i){ if(!db.songs.some(function(s){return s.cloud&&s.cloud.sid===i.sid;})&&need.indexOf(i.vid)<0) need.push(i.vid); });
  var vs={};
  if(need.length){ (ck(await C.sb.from('song_versions').select('id,song_id,author,name,data').in('id',need)).data||[]).forEach(function(v){ vs[v.id]=v; }); }
  its.forEach(function(i){
    var s=db.songs.filter(function(z){return z.cloud&&z.cloud.sid===i.sid;})[0];
    if(!s){ var v=vs[i.vid]; if(!v){ miss++; return; } s=songFromCloud({id:i.sid,title:i.t,artist:i.a||''},v); db.songs.push(s); }
    var o={sid:s.id,k:i.k}; if(i.parts) o.parts=i.parts; items.push(o);
  });
  db.sets.push({id:uid(),name:(r.title||'Servicio'),date:today(),items:items}); save();
  toast('Repertorio copiado a tu libro'+(miss?' ('+miss+' cantos no se pudieron abrir)':''));
}

  case 'cl-unshare': if(ui.confirm==='sdel'+t.dataset.id){ ui.confirm=''; cRun(async function(){ ck(await C.sb.from('shared_sets').delete().eq('id',t.dataset.id)); Object.keys(cShares()).forEach(function(k){ if(cShares()[k]===t.dataset.id) cShareSet(k,null); }); C.sets=null; },'Ya no se comparte'); } else { ui.confirm='sdel'+t.dataset.id; cRender(); } break;
  case 'cl-savename': cRun(async function(){ ck(await C.sb.from('profiles').update({name:cVal('cl-myname')}).eq('id',C.user.id)); C.names={}; await cProfile(); },'Nombre guardado'); break;
  case 'cl-invadd': cRun(async function(){ var e=cVal('cl-inv').toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(e)) throw new Error('valid email'); ck(await C.sb.from('invites').upsert({email:e},{onConflict:'email'})); C.invites=null; },'Invitación agregada'); break;
  case 'cl-invdel': cRun(async function(){ ck(await C.sb.from('invites').delete().eq('email',t.dataset.e)); C.invites=null; },'Invitación quitada'); break;
  }
}
document.addEventListener('input',function(e){ if(e.target.id==='cl-q'){ C.q=e.target.value; var b=$('#cl-body'); if(b&&C.sub==='catalog'&&!C.open){ b.innerHTML=cCatalogHTML(); var q=$('#cl-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } } } });

try{ if(/^https?:$/.test(location.protocol)&&(localStorage.getItem('libro-cantos.auth')||/[?&#](code|access_token|type)=/.test(location.href))) cStart(); }catch(e){}

/* ---------- RESPALDO ---------- */
function buildBackup(){
  var nEx=db.songs.filter(function(s){return s.example;}).length, nH=db.songs.reduce(function(a,s){return a+s.history.length;},0);
  $('#main').innerHTML='<div class="page">'+
   '<div class="card"><h3>Tu información</h3><div class="stat"><div><b>'+db.songs.length+'</b><small>cantos</small></div><div><b>'+db.sets.length+'</b><small>repertorios</small></div><div><b>'+nH+'</b><small>veces registradas</small></div></div>'+
   '<div class="hint">Todo se guarda en este dispositivo y navegador. Copia un respaldo de vez en cuando y pásalo a tu otro dispositivo para tener los mismos cantos.</div></div>'+
   '<div class="card"><h3>Sacar respaldo</h3><div class="actions"><button class="btn primary" data-a="export">Copiar respaldo</button></div>'+
   '<textarea class="textarea mono" id="b-out" readonly rows="5" aria-label="Texto del respaldo"></textarea><div class="hint">Pega ese texto en un mensaje o nota a ti mismo. En el otro dispositivo lo pegas aquí abajo.</div></div>'+
   '<div class="card"><h3>Cargar respaldo</h3><textarea class="textarea mono" id="b-in" rows="5" placeholder="Pega aquí el respaldo" aria-label="Pegar respaldo"></textarea>'+
   '<label class="f">…o elige un archivo de respaldo<input class="input" type="file" id="b-file" accept=".json,application/json,text/plain"></label>'+
   '<div class="actions"><button class="btn primary" data-a="imp-merge">Combinar con lo que tengo</button><button class="btn danger'+(ui.confirm==='imp'?' sure':'')+'" data-a="imp-replace">'+(ui.confirm==='imp'?'Toca otra vez para reemplazar todo':'Reemplazar todo')+'</button></div>'+
   '<div class="hint">Combinar agrega los cantos y repertorios nuevos y suma el historial. Reemplazar borra lo que hay en este dispositivo.</div></div>'+
   (nEx?'<div class="card"><h3>Cantos de ejemplo</h3><div class="hint">Hay '+nEx+' cantos de muestra para probar la app.</div><div class="actions"><button class="btn" data-a="rm-ex">Quitar cantos de ejemplo</button></div></div>':'')+
   '</div>';
  $('#b-out').value=JSON.stringify(db);
}
function readBackup(){
  var t=$('#b-in').value.trim(); if(!t){ toast('Pega primero el texto del respaldo.'); return null; }
  try{ var d=JSON.parse(t); if(!d||!Array.isArray(d.songs)) throw 0; return norm(d); }catch(e){ toast('Ese texto no es un respaldo válido.'); return null; }
}
function mergeBackup(d){
  var added=0;
  d.songs.forEach(function(n){ var o=song(n.id); if(!o){ db.songs.push(n); added++; } else { n.history.forEach(function(h){ if(!o.history.some(function(x){return x.d===h.d;})) o.history.push(h); }); } });
  d.sets.forEach(function(n){ if(!db.sets.some(function(x){return x.id===n.id;})) db.sets.push(n); });
  return added;
}

/* ---------- pantalla ---------- */
function renderApp(){
  [].forEach.call(document.querySelectorAll('.tab'),function(b){ b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'); });
  if(ui.tab!=='songs') ui.read=false;
  $('#app').classList.toggle('reading',ui.read);
  if(ui.tab==='songs') buildSongs(); else if(ui.tab==='sets') buildSets(); else if(ui.tab==='cloud') buildCloud(); else buildBackup();
}
var rz; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(function(){ if(ui.tab==='songs'&&!ui.edit&&!ui.imp) fitChart(); },150); });
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(ui.tab==='songs'&&!ui.edit&&!ui.imp) fitChart(); }); }catch(e){}
var wl=null;
function setWake(on,quiet){
  ui.wake=on;
  if(on){ try{ navigator.wakeLock.request('screen').then(function(l){ wl=l; }).catch(function(){ ui.wake=false; if(!quiet) toast('Este navegador no permite mantener la pantalla encendida.'); }); }catch(e){ ui.wake=false; if(!quiet) toast('Este navegador no permite mantener la pantalla encendida.'); } }
  else if(wl){ try{ wl.release(); }catch(e){} wl=null; }
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&ui.wake) setWake(true); });

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t) return;
  var a=t.dataset.a, s, x;
  if(a.indexOf('cl-')===0){ cloudClick(a,t); return; }
  switch(a){
  case 'tab': ui.tab=t.dataset.tab; ui.confirm=''; if(ui.tab==='songs'&&!ui.sel&&wide()&&db.songs.length&&!ui.edit){ var f0=filtered()[0]; if(f0) pickSong(f0.id); } renderApp(); break;
  case 'sel': pickSong(t.dataset.id); renderList(); renderDetail(); syncSplit(); $('#detail').scrollTop=0; break;
  case 'back': ui.sel=null; renderList(); renderDetail(); syncSplit(); break;
  case 'impstart': ui.imp=true; ui.edit=null; ui.note=''; renderDetail(); syncSplit(); $('#detail').scrollTop=0; break;
  case 'impcancel': ui.imp=false; renderDetail(); syncSplit(); break;
  case 'impgo': var itx=$('#imp-text').value; if(!itx.trim()){ toast('Pega primero el canto.'); break; }
    var pi=parseImport(itx); ui.edit={id:uid(),title:pi.title,artist:pi.artist,orig:pi.k,minor:pi.minor,keys:[pi.k],tempo:'',rhythm:'',tags:[],themes:[],cats:[],notes:'',chart:pi.chart,links:[],history:[],capoByKey:{}}; ui.note=pi.note; ui.imp=false; renderDetail(); syncSplit(); $('#detail').scrollTop=0; break;
  case 'read': ui.read=true; $('#app').classList.add('reading'); setWake(true,true); renderDetail(); window.scrollTo(0,0); break;
  case 'unread': ui.read=false; $('#app').classList.remove('reading'); setWake(false); renderDetail(); break;
  case 'kshift': s=song(ui.sel); ui.key=mod(ui.key+(+t.dataset.d)); ui.capo=(s.capoByKey||{})[ui.key]||0; renderDetail(); break;
  case 'cshift': s=song(ui.sel); ui.capo=Math.max(0,Math.min(7,ui.capo+(+t.dataset.d))); s.capoByKey=s.capoByKey||{}; s.capoByKey[ui.key]=ui.capo; save(); renderDetail(); break;
  case 'new': ui.imp=false; ui.note=''; ui.edit={id:uid(),title:'',artist:'',orig:7,minor:false,keys:[7],tempo:'',rhythm:'',tags:[],themes:[],cats:[],notes:'',chart:'',links:[],history:[],capoByKey:{}}; ui.confirm=''; renderDetail(); syncSplit(); $('#detail').scrollTop=0; break;
  case 'edit': s=song(ui.sel); ui.edit=JSON.parse(JSON.stringify(s)); ui.confirm=''; renderDetail(); syncSplit(); $('#detail').scrollTop=0; break;
  case 'cancel': ui.edit=null; ui.note=''; ui.confirm=''; if(!song(ui.sel)) ui.sel=null; renderDetail(); syncSplit(); break;
  case 'save': saveEditor(); break;
  case 'rmbook': s=song(ui.sel); if(!s) break; if(ui.confirm==='rmbook') deleteSong(s.id); else { ui.confirm='rmbook'; renderDetail(); } break;
  case 'delete': if(ui.confirm==='del') deleteSong(ui.edit.id); else { ui.confirm='del'; t.textContent='Toca otra vez para eliminar'; t.classList.add('sure'); } break;
  case 'kc': case 'cc': case 'tc': t.classList.toggle('on'); t.setAttribute('aria-pressed',t.classList.contains('on')); break;
  case 'key': s=song(ui.sel); ui.key=+t.dataset.k; ui.capo=(s.capoByKey||{})[ui.key]||0; renderDetail(); break;
  case 'capo': s=song(ui.sel); ui.capo=+t.dataset.c; s.capoByKey=s.capoByKey||{}; s.capoByKey[ui.key]=ui.capo; save(); renderDetail(); break;
  case 'fs': ui.fs=Math.max(13,Math.min(40,ui.fs+(+t.dataset.d)*2)); try{localStorage.setItem('libro-cantos.fs',ui.fs);}catch(err){} renderDetail(); break;
  case 'wake': setWake(!ui.wake); renderDetail(); break;
  case 'played':
    s=song(ui.sel); var d=$('#played-date').value||today();
    s.history=s.history.filter(function(h){return h.d!==d;}); s.history.push({d:d,k:ui.key}); save(); renderList(); renderDetail(); toast('Registrado: '+ago(daysSince(d))+' en '+keyName(ui.key,s.minor)); break;
  case 'rmhist': s=song(ui.sel); s.history=s.history.filter(function(h){return h.d!==t.dataset.d;}); save(); renderList(); renderDetail(); break;
  case 'link': s=song(ui.sel); var sel=$('#link-sel'); if(sel&&sel.value){ var o=song(sel.value); if(s.links.indexOf(o.id)<0) s.links.push(o.id); if(o.links.indexOf(s.id)<0) o.links.push(s.id); save(); renderDetail(); } break;
  case 'unlink': s=song(ui.sel); var o2=song(t.dataset.id); s.links=s.links.filter(function(l){return l!==t.dataset.id;}); if(o2) o2.links=o2.links.filter(function(l){return l!==s.id;}); save(); renderDetail(); break;
  case 'parts': x=curSet(); ui.partsIdx=(ui.partsIdx===+t.dataset.i)?-1:+t.dataset.i; renderItems(); break;
  case 'pt': x=curSet(); var pit=x.items[+t.dataset.i], pbl=blocksOf(song(pit.sid)), pn=+t.dataset.b, cur=pit.parts&&pit.parts.length?pit.parts.slice():pbl.map(function(b,q){return q;});
    if(cur.indexOf(pn)>-1){ if(cur.length===1){ toast('Deja al menos una parte.'); break; } cur=cur.filter(function(q){return q!==pn;}); } else cur.push(pn);
    cur.sort(function(a,b){return a-b;}); if(cur.length===pbl.length) delete pit.parts; else pit.parts=cur; save(); renderItems(); break;
  case 'ptall': x=curSet(); delete x.items[+t.dataset.i].parts; save(); renderItems(); break;
  case 'ptcoro': x=curSet(); var cit=x.items[+t.dataset.i], cbl=blocksOf(song(cit.sid)), cc=[]; cbl.forEach(function(b,q){ if(b.coro) cc.push(q); }); if(cc.length&&cc.length<cbl.length) cit.parts=cc; else delete cit.parts; save(); renderItems(); break;
  case 'ptdone': ui.partsIdx=-1; renderItems(); break;
  case 'repeat': x=curSet(); var rit=x.items[+t.dataset.i], rbl=blocksOf(song(rit.sid)), rc=[]; rbl.forEach(function(b,q){ if(b.coro) rc.push(q); });
    var ni={sid:rit.sid,k:rit.k}; if(rc.length&&rc.length<rbl.length) ni.parts=rc; x.items.push(ni); ui.partsIdx=x.items.length-1; save(); renderSetList(); renderItems(); renderPick(); toast(ni.parts?'Agregado al final: solo el coro. Cambia las partes si quieres otra.':'Agregado al final. Elige qué partes quieres.'); break;
  case 'pcat': ui.pcat=t.dataset.c; renderPick(); break;
  case 'plstart': plStart(); break;
  case 'plexit': plExit(); break;
  case 'plmenu': var pm=$('.pl-set'); if(pm) pm.hidden=!pm.hidden; plFit(); break;
  case 'pldir': PL.dir=t.dataset.d; plSave(); plBuild(true); break;
  case 'plcols': PL.cols=+t.dataset.n; plSave(); plBuild(true); break;
  case 'plfs': PL.fs=Math.max(12,Math.min(64,PL.fs+(+t.dataset.d)*2)); plSave(); plBuild(true); break;
  case 'plreset': try{ localStorage.removeItem('libro-cantos.player'); }catch(err){} plLoad(); plBuild(true); toast('Ajustes recomendados para esta pantalla'); break;
  case 'plnext': plGo(PL.i+1); break;
  case 'plprev': plGo(PL.i-1); break;
  /* repertorios */
  case 'setnew': x={id:uid(),name:'',date:today(),items:[]}; db.sets.push(x); ui.set=x.id; ui.pq=''; ui.confirm=''; save(); buildSets(); break;
  case 'setsel': ui.partsIdx=-1; ui.set=t.dataset.id; ui.pq=''; ui.confirm=''; renderSetList(); renderSetDetail(); syncSetSplit(); $('#set-detail').scrollTop=0; break;
  case 'setback': ui.set=null; renderSetList(); renderSetDetail(); syncSetSplit(); break;
  case 'additem': x=curSet(); x.items.push({sid:t.dataset.id,k:+t.dataset.k}); save(); renderSetList(); renderItems(); renderPick(); break;
  case 'rmitem': x=curSet(); ui.partsIdx=-1; x.items.splice(+t.dataset.i,1); save(); renderSetList(); renderItems(); renderPick(); break;
  case 'up': case 'down': x=curSet(); ui.partsIdx=-1; var i=+t.dataset.i, j=a==='up'?i-1:i+1; if(j>=0&&j<x.items.length){ var tmp=x.items[i]; x.items[i]=x.items[j]; x.items[j]=tmp; save(); renderItems(); renderPick(); } break;
  case 'openitem': x=curSet(); var it=x.items[+t.dataset.i]; pickSong(it.sid); ui.key=it.k; var sg=song(it.sid); ui.capo=(sg.capoByKey||{})[ui.key]||0; ui.tab='songs'; renderApp(); syncSplit(); break;
  case 'setplayed': x=curSet(); if(!x.items.length){ toast('Agrega cantos al repertorio primero.'); break; } x.items.forEach(function(it){ var sg2=song(it.sid); if(!sg2) return; sg2.history=sg2.history.filter(function(h){return h.d!==x.date;}); sg2.history.push({d:x.date,k:it.k}); }); save(); renderPick(); toast('Historial actualizado con '+x.items.length+' cantos'); break;
  case 'setdel': if(ui.confirm==='setdel'){ db.sets=db.sets.filter(function(y){return y.id!==ui.set;}); ui.set=null; ui.confirm=''; save(); buildSets(); toast('Repertorio eliminado'); } else { ui.confirm='setdel'; renderSetDetail(); } break;
  /* respaldo */
  case 'export': var ta=$('#b-out'); ta.value=JSON.stringify(db); ta.focus(); ta.select();
    try{ navigator.clipboard.writeText(ta.value).then(function(){ toast('Respaldo copiado'); },function(){ toast('Selecciona el texto y cópialo a mano'); }); }catch(err){ toast('Selecciona el texto y cópialo a mano'); } break;
  case 'imp-merge': var dm=readBackup(); if(dm){ var n=mergeBackup(dm); save(); ui.confirm=''; buildBackup(); toast(n+' cantos nuevos agregados'); } break;
  case 'imp-replace': if(ui.confirm==='imp'){ var dr=readBackup(); if(dr){ db=dr; db.bundled=BUNDLE_V; save(); ui.sel=null; ui.set=null; ui.confirm=''; buildBackup(); toast('Respaldo cargado'); } } else if(readBackup()){ ui.confirm='imp'; var keep=$('#b-in').value; buildBackup(); $('#b-in').value=keep; } break;
  case 'rm-ex': var ids=db.songs.filter(function(s2){return s2.example;}).map(function(s2){return s2.id;}); db.songs=db.songs.filter(function(s2){return !s2.example;}); db.songs.forEach(function(s2){s2.links=s2.links.filter(function(l){return ids.indexOf(l)<0;});}); db.sets.forEach(function(y){y.items=y.items.filter(function(i2){return ids.indexOf(i2.sid)<0;});}); if(ids.indexOf(ui.sel)>-1) ui.sel=null; save(); buildBackup(); toast('Cantos de ejemplo quitados'); break;
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='f-q'){ ui.q=e.target.value; renderList(); }
  else if(id==='pick-q'){ ui.pq=e.target.value; renderPick(); }
  else if(id==='set-name'){ var x=curSet(); x.name=e.target.value; save(); renderSetList(); }
});
document.addEventListener('change',function(e){
  var id=e.target.id, t=e.target;
  if(id==='pick-key'){ ui.pkey=t.value; renderPick(); }
  else if(id==='f-key'){ ui.fk=t.value; renderList(); }
  else if(id==='f-rhy'){ ui.fr=t.value; renderList(); }
  else if(id==='f-sort'){ ui.sort=t.value; renderList(); }
  else if(id==='f-cat'){ ui.fc=t.value; renderList(); }
  else if(id==='f-theme'){ ui.ft=t.value; renderList(); }
  else if(id==='imp-file'&&t.files&&t.files[0]){ var r2=new FileReader(); r2.onload=function(){ $('#imp-text').value=String(r2.result); }; r2.readAsText(t.files[0]); }

  else if(id==='b-file'&&t.files&&t.files[0]){ var r=new FileReader(); r.onload=function(){ $('#b-in').value=String(r.result); toast('Archivo leído. Elige cómo cargarlo.'); }; r.readAsText(t.files[0]); }
});
